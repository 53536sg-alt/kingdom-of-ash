  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <rect x=".7" y=".7" width="30.6" height="30.6" rx="6.4" fill="none" stroke="#d4ac45" stroke-opacity=".28" stroke-width="1"/>

