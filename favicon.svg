    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e2a4"/>
      <stop offset=".55" stop-color="#d4ac45"/>
      <stop offset="1" stop-color="#9c7420"/>
